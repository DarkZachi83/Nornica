name: testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Biblioteki systemowe (wirtualny ekran, zbar, czcionki)
        run: sudo apt-get update && sudo apt-get install -y xvfb libzbar0 fonts-dejavu-core
      - name: Zależności
        run: pip install -r requirements-dev.txt
      - name: Testy (z interfejsem na wirtualnym ekranie)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m unittest discover -s testy -t . -v
